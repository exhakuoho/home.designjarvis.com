<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="守家控制台：設備控制、事件處理、提醒排程、情境規則與家屬通知的後台原型（模擬數據）。">
<meta property="og:description" content="守家控制台：設備控制、事件處理、提醒排程、情境規則與家屬通知的後台原型（模擬數據）。">
<meta property="og:site_name" content="DesignJarvis">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>守家控制台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 版面：左側石徑導覽＋右側工作區。同一套白砂、墨、苔、弁柄色；操作介面以黑體為主，明朝只用在標題與狀態大字。 */
:root{
  --sand:#E7E4DB; --sand-2:#DCD8CC; --card:#EFEDE6; --line:#C4BEAE; --line-2:#D3CEC1;
  --ink:#24231E; --ink-2:#5C594F; --ink-3:#8A867B;
  --stone-dark:#45433D; --moss:#56692F; --bengara:#93442D; --ochre:#946A1C; --lamp:#C99A45;
  --s-local:#6B8A2E; --s-cloud:#3B5FA0; --heat:#56692F;
  --c-fire:#9A4A31; --c-moon:#46617F; --c-leaf:#5D7344; --c-sun:#B08D4A; --c-star:#655279;
  --f-display:"Zen Old Mincho","Noto Serif TC","Songti TC",serif;
  --f-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --sand:#1A1A17; --sand-2:#21211D; --card:#262622; --line:#3E3C35; --line-2:#33322C;
  --ink:#E4E0D4; --ink-2:#A8A497; --ink-3:#7A776D;
  --stone-dark:#6A675F; --moss:#8FAA5A; --bengara:#D0765A; --ochre:#D3A24A; --lamp:#E2B566;
  --s-local:#82A042; --s-cloud:#5F86CC; --heat:#9DB86A;
  --c-fire:#C26B50; --c-moon:#7896B8; --c-leaf:#8FA670; --c-sun:#D2B06A; --c-star:#9A86B0;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --sand:#1A1A17; --sand-2:#21211D; --card:#262622; --line:#3E3C35; --line-2:#33322C;
  --ink:#E4E0D4; --ink-2:#A8A497; --ink-3:#7A776D;
  --stone-dark:#6A675F; --moss:#8FAA5A; --bengara:#D0765A; --ochre:#D3A24A; --lamp:#E2B566;
  --s-local:#82A042; --s-cloud:#5F86CC; --heat:#9DB86A;
  --c-fire:#C26B50; --c-moon:#7896B8; --c-leaf:#8FA670; --c-sun:#D2B06A; --c-star:#9A86B0;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--sand);color:var(--ink);font-family:var(--f-ui);font-size:14.5px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--bengara);outline-offset:2px}
h1,h2,h3{margin:0;font-weight:700;text-wrap:balance}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.faint{color:var(--ink-3)}

.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
aside.side{background:var(--sand-2);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.seal{width:30px;height:30px;border:1.5px solid var(--bengara);color:var(--bengara);display:grid;place-items:center;font-family:var(--f-display);font-weight:900;font-size:17px;border-radius:3px;transform:rotate(-3deg);flex:none}
.brand b{font-family:var(--f-display);font-size:18px;letter-spacing:.12em;font-weight:900}
.brand small{display:block;font-size:11px;color:var(--ink-2);letter-spacing:.12em}
.home{padding:10px 10px;border:1px solid var(--line);border-radius:3px;font-size:13px;display:grid;gap:2px}
.home b{font-weight:500}
nav.nav{display:grid;gap:2px}
nav.nav button{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:8px;background:none;border:0;padding:8px 10px;border-radius:3px;cursor:pointer;text-align:left;color:var(--ink-2)}
nav.nav button .g{font-family:var(--f-display);font-weight:900;font-size:18px;color:var(--ink-3);text-align:center}
nav.nav button:hover{background:var(--card);color:var(--ink)}
nav.nav button[aria-current="page"]{background:var(--ink);color:var(--sand)}
nav.nav button[aria-current="page"] .g{color:var(--sand)}
.badge{font-size:11px;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--bengara);color:var(--sand);display:grid;place-items:center}
.side-foot{margin-top:auto;font-size:12px;color:var(--ink-2);display:grid;gap:6px;padding:0 8px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--moss);margin-right:6px;vertical-align:1px}
.dot.warn{background:var(--ochre)} .dot.crit{background:var(--bengara)} .dot.off{background:var(--ink-3)}

main{padding:20px clamp(16px,3vw,36px) 48px;min-width:0}
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.status{display:flex;align-items:center;gap:10px;padding:8px 14px;border-radius:3px;border:1px solid var(--line);background:var(--card)}
.status .big{font-family:var(--f-display);font-weight:900;font-size:17px;letter-spacing:.08em}
.status.alert{border-color:var(--bengara);background:color-mix(in srgb,var(--bengara) 12%,var(--card))}
.status.alert .big{color:var(--bengara)}
.status.warn{border-color:var(--ochre)}
.clock{font-size:13px;color:var(--ink-2);margin-left:auto}
.btn{background:var(--card);border:1px solid var(--line);border-radius:3px;padding:7px 12px;cursor:pointer;font-size:13.5px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--ink);color:var(--sand);border-color:var(--ink)}
.btn.danger{color:var(--bengara);border-color:var(--bengara)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.pop{position:relative}
.pop-menu{position:absolute;right:0;top:calc(100% + 6px);background:var(--card);border:1px solid var(--line);border-radius:3px;padding:6px;min-width:220px;z-index:30;box-shadow:0 8px 24px rgba(0,0,0,.12);display:grid}
.pop-menu button{background:none;border:0;text-align:left;padding:8px 10px;border-radius:2px;cursor:pointer;display:flex;justify-content:space-between;gap:12px}
.pop-menu button:hover{background:var(--sand-2)}

.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.phead h1{font-family:var(--f-display);font-weight:900;font-size:26px;letter-spacing:.08em}
.phead p{color:var(--ink-2);font-size:13.5px;margin-top:2px}
.grid{display:grid;gap:16px}
.g-over{grid-template-columns:repeat(12,minmax(0,1fr))}
.span-4{grid-column:span 4}.span-5{grid-column:span 5}.span-6{grid-column:span 6}.span-7{grid-column:span 7}.span-8{grid-column:span 8}.span-12{grid-column:span 12}
.card{background:var(--card);border:1px solid var(--line-2);border-radius:3px;padding:16px 18px;min-width:0}
.card h2{font-size:14px;font-weight:700;letter-spacing:.06em;display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.card h2 small{font-weight:400;color:var(--ink-2);font-size:12px;letter-spacing:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13.5px}
.kv dt{color:var(--ink-2)} .kv dd{margin:0}
.elder{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.stone{width:62px;height:50px;border-radius:52% 48% 46% 54% / 60% 58% 42% 40%;background:var(--stone-dark);position:relative;flex:none}
.stone::after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:var(--sc,var(--moss));top:13px;left:22px}
.elder .where{font-family:var(--f-display);font-weight:900;font-size:24px;letter-spacing:.08em}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;margin-top:14px;border-top:1px solid var(--line-2)}
.tiles div{padding:10px 10px 0 0}
.tiles div+div{padding-left:12px;border-left:1px solid var(--line-2)}
.tiles b{display:block;font-size:20px;font-weight:500}
.tiles span{font-size:12px;color:var(--ink-2)}

.sev{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:1px 8px;border-radius:2px;border:1px solid var(--line);white-space:nowrap}
.sev::before{font-size:11px}
.sev.info{color:var(--ink-2)} .sev.info::before{content:"○"}
.sev.warn{color:var(--ochre);border-color:var(--ochre)} .sev.warn::before{content:"△"}
.sev.crit{color:var(--bengara);border-color:var(--bengara)} .sev.crit::before{content:"◆"}
.st{font-size:12px;white-space:nowrap}
.st.pending{color:var(--bengara);font-weight:500} .st.auto{color:var(--moss)} .st.done{color:var(--ink-2)}
.who{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.who i{width:8px;height:8px;border-radius:50%;background:var(--dotc,var(--stone-dark))}

.list{display:grid}
.list > div{display:grid;grid-template-columns:52px 1fr auto;gap:10px;padding:9px 0;border-top:1px dashed var(--line-2);align-items:start}
.list > div:first-child{border-top:0}
.list .t{font-size:12.5px;color:var(--ink-2);padding-top:1px}
.empty{color:var(--ink-2);font-size:13.5px;padding:18px 0;text-align:center;border:1px dashed var(--line);border-radius:3px}

.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:9px 12px 9px 0;border-bottom:1px solid var(--line-2);vertical-align:top}
th{font-weight:500;font-size:12px;color:var(--ink-2);letter-spacing:.08em;white-space:nowrap}
tr.row{cursor:pointer}
tr.row:hover td{background:color-mix(in srgb,var(--sand-2) 60%,transparent)}
tr.detail td{background:var(--sand-2);padding:14px 16px}
.ev-detail{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
textarea,input[type=text],input[type=time],input[type=number],select{background:var(--sand);border:1px solid var(--line);border-radius:3px;padding:7px 10px;min-width:0}
textarea{width:100%;min-height:64px;resize:vertical}
label.f{display:grid;gap:4px;font-size:12.5px;color:var(--ink-2)}
label.f > *{color:var(--ink);font-size:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:none;border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:12.5px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--sand);border-color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.seg button{background:none;border:0;padding:6px 14px;cursor:pointer;font-size:13px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--sand)}

.sw{width:38px;height:22px;border-radius:11px;border:1px solid var(--line);background:var(--sand-2);position:relative;cursor:pointer;flex:none;padding:0}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--ink-3);transition:left .15s,background .15s}
.sw[aria-checked="true"]{background:var(--moss);border-color:var(--moss)}
.sw[aria-checked="true"]::after{left:18px;background:var(--sand)}
.sw:disabled{opacity:.5;cursor:not-allowed}

/* 設備 */
.dev-grid{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start}
.plan{display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(6,38px);gap:4px}
.room{border:1px solid var(--line);border-radius:2px;background:var(--sand);cursor:pointer;padding:5px 7px;font-size:12px;display:flex;flex-direction:column;justify-content:space-between;text-align:left}
.room:hover{border-color:var(--ink-2)}
.room[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.room .rn{font-weight:500}
.room .rs{display:flex;gap:6px;align-items:center;color:var(--ink-2);font-size:11px}
.room.alarm{border-color:var(--bengara);background:color-mix(in srgb,var(--bengara) 12%,var(--sand))}
.elder-mark{font-family:var(--f-display);font-weight:900;color:var(--ink);font-size:12px}
.rgroup{margin-bottom:18px}
.rgroup h3{font-size:13px;color:var(--ink-2);letter-spacing:.1em;font-weight:500;margin-bottom:6px;display:flex;gap:8px;align-items:center}
.dev{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 90px minmax(150px,auto);gap:12px;align-items:center;padding:10px 12px;background:var(--card);border:1px solid var(--line-2);border-radius:3px;margin-bottom:6px}
.dev.alarm{border-color:var(--bengara)}
.dev .dn{font-weight:500}
.dev .dt{font-size:12px;color:var(--ink-2)}
.dev .dv{font-size:13.5px}
.dev .meta{font-size:12px;color:var(--ink-2);display:grid;gap:1px}
.ctl{display:flex;align-items:center;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.ctl input[type=range]{width:90px;accent-color:var(--moss)}
.batt.low{color:var(--bengara);font-weight:500}

/* 規則 */
.rule{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:14px 16px;background:var(--card);border:1px solid var(--line-2);border-radius:3px;margin-bottom:8px}
.rule.off{opacity:.6}
.rule h3{font-size:15px;margin-bottom:6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.clause{display:grid;grid-template-columns:28px 1fr;gap:4px 8px;font-size:13.5px}
.clause b{font-family:var(--f-display);font-weight:900;color:var(--ink-2)}
.rule .rmeta{font-size:12px;color:var(--ink-2);margin-top:8px}
.lock{font-size:11px;border:1px solid var(--line);padding:0 6px;border-radius:2px;color:var(--ink-2);font-weight:400}

/* 提醒 */
.adh{display:grid;grid-template-columns:repeat(7,22px);gap:4px}
.adh span{width:22px;height:22px;border-radius:3px;display:grid;place-items:center;font-size:11px;border:1px solid var(--line-2)}
.adh .ok{background:var(--moss);color:var(--sand);border-color:var(--moss)}
.adh .late{background:color-mix(in srgb,var(--ochre) 30%,transparent);color:var(--ochre);border-color:var(--ochre)}
.adh .miss{color:var(--bengara);border-color:var(--bengara)}
.adh .up{color:var(--ink-3)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);align-items:center}
.legend i{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:5px;vertical-align:-2px}
form.add{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end;padding:14px;border:1px dashed var(--line);border-radius:3px;margin-top:12px}

/* 紀錄 */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border:1px solid var(--line-2);border-radius:3px;background:var(--card)}
.stats div{padding:14px 16px}
.stats div+div{border-left:1px solid var(--line-2)}
.stats b{display:block;font-size:24px;font-weight:500}
.stats span{font-size:12px;color:var(--ink-2)}
svg text{fill:var(--ink-2);font-family:var(--f-ui);font-size:11px}
svg .grid-l{stroke:var(--line-2);stroke-width:1}
svg .axis{stroke:var(--line);stroke-width:1}
.chart{width:100%;height:auto;display:block}
details.tv{margin-top:8px;font-size:12.5px}
details.tv summary{cursor:pointer;color:var(--ink-2)}
#tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:var(--sand);font-size:12px;padding:5px 9px;border-radius:3px;white-space:pre;display:none}

/* 系統 */
.meter{height:6px;background:var(--sand-2);border-radius:3px;overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--moss);border-radius:3px}
.meter.warn i{background:var(--ochre)}
.sys{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.sys .card b{font-size:22px;font-weight:500;display:block}

.toast{position:fixed;right:20px;bottom:20px;z-index:60;display:grid;gap:8px;max-width:340px}
.toast div{background:var(--ink);color:var(--sand);padding:12px 14px;border-radius:3px;font-size:13.5px;box-shadow:0 8px 24px rgba(0,0,0,.2);animation:up .25s ease}
.toast div.crit{background:var(--bengara)}
@keyframes up{from{transform:translateY(8px);opacity:.3}to{transform:none;opacity:1}}
.sim-note{font-size:12px;color:var(--ink-3);margin-top:28px}

@media (max-width:1100px){
  .span-4,.span-5,.span-6,.span-7,.span-8{grid-column:span 12}
  .sys{grid-template-columns:repeat(2,minmax(0,1fr))}
  .dev-grid{grid-template-columns:1fr}
  .plan{max-width:420px}
}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  aside.side{position:sticky;top:env(safe-area-inset-top,0px);height:auto;z-index:20;flex-direction:row;align-items:center;padding:10px 16px;gap:12px;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto}
  .home,.side-foot{display:none}
  .brand small{display:none}
  nav.nav{display:flex;gap:2px}
  nav.nav button{grid-template-columns:auto auto;padding:6px 9px;gap:4px;white-space:nowrap}
  nav.nav button .l{font-size:13px}
  nav.nav button .badge{display:none}
  .dev{grid-template-columns:minmax(0,1fr) auto;}
  .dev .meta{display:none}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stats div:nth-child(3){border-left:0}
  .stats div:nth-child(n+3){border-top:1px solid var(--line-2)}
  .ev-detail{grid-template-columns:1fr}
}
@media (max-width:520px){
  nav.nav button .l{display:none}
  .sys{grid-template-columns:1fr}
  .tiles{grid-template-columns:1fr}
  .tiles div+div{padding-left:0;border-left:0;border-top:1px solid var(--line-2);padding-top:8px}
  .clock{margin-left:0}
  .dev .dv{grid-column:1/-1}
}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><span class="seal" aria-hidden="true">守</span><div><b>守家</b><small>控制台</small></div></div>
    <div class="home"><b id="home-name">示範家庭・阿嬤的家</b><span class="muted">主神 × 5 式守・29 台設備</span></div>
    <nav class="nav" id="nav" aria-label="功能"></nav>
    <div class="side-foot">
      <span><span class="dot" id="foot-dot"></span>主神 <span data-live="hubState">本地運作中</span></span>
      <span>雲端閘道 <span data-live="gw">已連線</span></span>
      <span class="faint">所有數據皆為模擬</span>
      <a href="./" style="color:var(--ink-2)">守家 產品展示頁 ↗</a>
    </div>
  </aside>
  <main id="main"></main>
</div>
<div id="tip"></div>
<div class="toast" id="toast" aria-live="assertive"></div>

<script>
(() => {
/* ================= 工具 ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const pad=n=>String(n).padStart(2,'0');
const hm=ts=>{const d=new Date(ts);return pad(d.getHours())+':'+pad(d.getMinutes())};
const dayKey=ts=>{const d=new Date(ts);d.setHours(0,0,0,0);return d.getTime()};
function dayLabel(ts){const diff=Math.round((dayKey(Date.now())-dayKey(ts))/864e5);if(diff===0)return'今天';if(diff===1)return'昨天';const d=new Date(ts);return`${d.getMonth()+1}/${d.getDate()}`}
function ago(ts){const m=Math.round((Date.now()-ts)/6e4);if(m<1)return'剛剛';if(m<60)return m+' 分鐘前';const h=Math.floor(m/60);if(h<24)return h+' 小時前';return Math.floor(h/24)+' 天前'}
function rng(seed){let a=seed>>>0;return()=>{a+=0x6D2B79F5;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
const R=rng(dayKey(Date.now())/864e5|0);
const at=(dayOff,h,m)=>{const d=new Date();d.setDate(d.getDate()-dayOff);d.setHours(h,m,0,0);return d.getTime()};

function step(){
  sim.tick++;
  const h=new Date().getHours(), night=h<6||h>=22, e=sim.elder;
  if(!night && Math.random()<.06){const n=NEIGH[e.room];e.room=n[Math.floor(Math.random()*n.length)];e.since=Date.now();e.moveTs=Date.now();}
  else if(!night && Math.random()<.3){e.moveTs=Date.now()}
  ROOMS.forEach(r=>{const v=sim.env[r.id];
    let target=25.8; if(r.id==='客廳'){const ac=dev('客廳','ac'); if(ac&&ac.on) target=ac.set+.4;}
    if(r.id==='廚房') target=27.2; if(r.id==='浴室') target=26.4;
    v.t+= (target-v.t)*.05+(Math.random()-.5)*.08; v.h+=(Math.random()-.5)*.4; v.h=Math.max(45,Math.min(78,v.h));
    if(v.pm!=null){v.pm+=(Math.random()-.5)*1.2;v.pm=Math.max(4,Math.min(40,v.pm));}
  });
  sim.power.push(powerNow()+Math.round((Math.random()-.5)*18)); if(sim.power.length>40) sim.power.shift();
  sim.cpu=clamp(sim.cpu+(Math.random()-.5)*6,12,48); sim.gpu=clamp(sim.gpu+(Math.random()-.5)*8,4,55);
  sim.temp=clamp(sim.temp+(Math.random()-.5)*.8,46,58); sim.gw=clamp(sim.gw+(Math.random()-.5)*10,28,90); sim.ram=clamp(sim.ram+(Math.random()-.5)*.1,3.1,4.2);
  if(sim.tick%20===0 && Math.random()<.5) ambientVoice();
  updateLive();
}

  if(ev.type==='瓦斯異常'){const g=dev('廚房','gas'); if(g) g.alarm=false;}
  if(ev.type==='大門未關'){const d=dev('玄關','door'); if(d) d.open=false;}
  if(ev.type==='電器未關'){const p=dev('客廳','plug'); if(p) p.on=false;}
}

function topbar(){
  const p=pending(), crit=p.some(e=>e.sev==='crit');
  const cls=crit?'alert':p.length?'warn':'';
  const txt=crit?'警示中・請立即確認':p.length?`守護中・${p.length} 件待處理`:'守護中・一切平安';
  return`<div class="topbar">
    <div class="status ${cls}" role="status"><span class="dot ${crit?'crit':p.length?'warn':''}"></span><span class="big">${txt}</span></div>
    ${p.length?`<button class="btn sm" data-act="go" data-v="events">查看事件</button>`:''}
    <span class="clock num">${L('clock')}</span>
    <div class="pop"><button class="btn" data-act="menu" aria-expanded="${ui.menu}">模擬事件 ▾</button>

}

const sevTag=s=>`<span class="sev ${s}">${SEV[s]}</span>`;
const whoTag=w=>`<span class="who" style="--dotc:var(${STONE[w]||'--stone-dark'})"><i></i>${esc(w)}</span>`;
function devValue(d){
  const env=sim.env[d.room];
  switch(d.type){
    case 'th': return `<span class="num">${env.t.toFixed(1)}°C・${Math.round(env.h)}%</span>`;
    case 'air': return `PM2.5 <span class="num">${Math.round(env.pm??10)}</span> μg/m³`;
    case 'motion': return sim.elder.room===d.room?'<b>有人</b>':'無人';
    case 'radar': return sim.elder.room===d.room?`<b>有人・${elderState()}</b>`:'無人';
    case 'gas': return d.alarm?'<b style="color:var(--bengara)">濃度異常</b>':'正常';
    case 'smoke': return '正常';
    case 'door': return d.open?'<b style="color:var(--ochre)">開啟</b>':'關閉';
    case 'voice': return '待命中';
    case 'hub': return `運作中・CPU ${Math.round(sim.cpu)}%`;
    case 'zhub': return `${S.devices.filter(x=>x.kind==='sensor'||x.kind==='control').length} 台已連線`;
    case 'light': return d.on?`開・${d.bri}%`:'關';
    case 'ac': return d.on?`開・設定 ${d.set}°C`:'關';
    case 'plug': return d.on?`開・<span class="num">${d.w.toLocaleString()}</span> W`:'關・0 W';
    default: return d.on?'開':'關';
  }
}
function devControl(d){
  const sw=`<button class="sw" role="switch" aria-checked="${!!d.on}" aria-label="${esc(d.room+d.name)}" data-act="toggle" data-id="${d.id}"></button>`;
  if(d.type==='light') return `<input type="range" min="5" max="100" step="5" value="${d.bri}" aria-label="亮度" data-range="${d.id}">${sw}`;
  if(d.type==='ac') return `<button class="btn sm" data-act="ac" data-id="${d.id}" data-d="-1" aria-label="降溫">−</button><span class="num">${d.set}°</span><button class="btn sm" data-act="ac" data-id="${d.id}" data-d="1" aria-label="升溫">＋</button>${sw}`;
  if(['plug','tv','relay'].includes(d.type)) return sw;
  if(d.type==='gas'&&d.alarm) return `<button class="btn sm danger" data-act="go" data-v="events">處理警示</button>`;
  if(d.type==='door'&&d.open) return `<span class="faint">等待關門</span>`;
  return '';
}
function sparkline(){
  const w=320,h=70,p=sim.power,max=Math.max(...p)*1.15,min=0;
  const x=i=>i/(p.length-1)*w, y=v=>h-(v-min)/(max-min)*h;
  const d=p.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('');
  const last=p[p.length-1];
  return `<svg class="chart" viewBox="0 0 ${w} ${h+4}" role="img" aria-label="近兩分鐘用電，目前 ${last} 瓦">
    <path d="${d} L${w},${h} L0,${h}Z" fill="var(--s-local)" opacity=".12"></path>
    <path d="${d}" fill="none" stroke="var(--s-local)" stroke-width="2" stroke-linejoin="round"></path>
    <circle cx="${x(p.length-1)}" cy="${y(last)}" r="4" fill="var(--s-local)" stroke="var(--card)" stroke-width="2"></circle></svg>`;
}

function adherence(rem){
  const r=rng(rem.label.length*131+rem.time.charCodeAt(1)), out=[];
  for(let d=6;d>=0;d--){const ts=at(d,+rem.time.slice(0,2),+rem.time.slice(3));
    if(ts>Date.now()) out.push(['up','—']); else {const x=r(); out.push(x<.82?['ok','✓']:x<.95?['late','遲']:['miss','✕']);}}
  return out;
}

function weekData(){
  const days=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);d.setHours(0,0,0,0);return d.getTime()});
  const voice=days.map(k=>{const v=S.voice.filter(x=>dayKey(x.ts)===k);return{k,local:v.filter(x=>x.route==='local').length,cloud:v.filter(x=>x.route==='cloud').length}});
  const night=days.map(k=>({k,n:S.events.filter(e=>e.type==='夜間如廁'&&dayKey(e.ts)===k).length}));
  const heat=days.map((k,di)=>{const r=rng(k/864e5|0);return[...Array(24)].map((_,h)=>{
    if(k===dayKey(Date.now())&&h>new Date().getHours()) return null;
    const base=h<6?.04:h<7?.35:h<9?.8:h<12?.55:h<14?.65:h<15?.25:h<18?.6:h<21?.7:h<22?.4:.1; return Math.max(0,Math.min(1,base+(r()-.5)*.3))})});
  return{days,voice,night,heat};
}
const dLab=k=>{const d=new Date(k);return`${d.getMonth()+1}/${d.getDate()}`};
function barChart(data,key,label){
  const w=420,h=170,pl=28,pb=22,pt=10,max=Math.max(3,...data.map(d=>d[key])),bw=(w-pl)/data.length;
  const y=v=>pt+(h-pt-pb)*(1-v/max);
  const ticks=[0,Math.ceil(max/2),max];
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="${label}">
    ${ticks.map(t=>`<line class="grid-l" x1="${pl}" x2="${w}" y1="${y(t)}" y2="${y(t)}"></line><text x="${pl-6}" y="${y(t)+4}" text-anchor="end">${t}</text>`).join('')}
    ${data.map((d,i)=>{const bh=(h-pt-pb)-(y(d[key])-pt), x=pl+i*bw+bw*.28; return `<g data-tip="${dLab(d.k)}　${label} ${d[key]} 次"><rect x="${pl+i*bw}" y="${pt}" width="${bw}" height="${h-pt-pb}" fill="transparent"></rect>${d[key]?`<path d="M${x},${h-pb} V${y(d[key])+4} q0,-4 4,-4 h${bw*.44-8} q4,0 4,4 V${h-pb}Z" fill="var(--s-local)"></path>`:''}</g><text x="${pl+i*bw+bw/2}" y="${h-6}" text-anchor="middle">${dLab(d.k)}</text>`}).join('')}
    <line class="axis" x1="${pl}" x2="${w}" y1="${h-pb}" y2="${h-pb}"></line></svg>`;
}
function stackChart(data){
  const w=420,h=190,pl=28,pb=22,pt=10,max=Math.max(5,...data.map(d=>d.local+d.cloud)),bw=(w-pl)/data.length;
  const sc=v=>(h-pt-pb)*v/max, ticks=[0,Math.round(max/2),max];
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="每日語音互動，本地與雲端">
    ${ticks.map(t=>`<line class="grid-l" x1="${pl}" x2="${w}" y1="${h-pb-sc(t)}" y2="${h-pb-sc(t)}"></line><text x="${pl-6}" y="${h-pb-sc(t)+4}" text-anchor="end">${t}</text>`).join('')}
    ${data.map((d,i)=>{const x=pl+i*bw+bw*.28, bwi=bw*.44, hl=sc(d.local), hc=sc(d.cloud);
      return `<g data-tip="${dLab(d.k)}\n本地 ${d.local} 次\n雲端 ${d.cloud} 次"><rect x="${pl+i*bw}" y="${pt}" width="${bw}" height="${h-pt-pb}" fill="transparent"></rect>
      ${hl?`<rect x="${x}" y="${h-pb-hl}" width="${bwi}" height="${hl}" fill="var(--s-local)"></rect>`:''}
      ${hc?`<path d="M${x},${h-pb-hl-2} V${h-pb-hl-hc+4} q0,-4 4,-4 h${bwi-8} q4,0 4,4 V${h-pb-hl-2}Z" fill="var(--s-cloud)"></path>`:''}</g>
      <text x="${pl+i*bw+bw/2}" y="${h-6}" text-anchor="middle">${dLab(d.k)}</text>`}).join('')}
    <line class="axis" x1="${pl}" x2="${w}" y1="${h-pb}" y2="${h-pb}"></line></svg>`;
}
function heatChart(days,heat){
  const w=640,cw=(w-44)/24,ch=18,h=7*(ch+3)+22;
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="近 7 天每小時活動熱度">
    ${days.map((k,di)=>`<text x="38" y="${di*(ch+3)+ch-4}" text-anchor="end">${dLab(k)}</text>`+heat[di].map((v,hh)=>v==null?'':`<rect x="${44+hh*cw}" y="${di*(ch+3)}" width="${cw-2}" height="${ch}" rx="2" fill="color-mix(in srgb,var(--heat) ${Math.round(8+v*88)}%,var(--card))" data-tip="${dLab(k)} ${pad(hh)}:00\n活動度 ${Math.round(v*100)}"></rect>`).join('')).join('')}
    ${[0,6,12,18,23].map(hh=>`<text x="${44+hh*cw+cw/2}" y="${h-4}" text-anchor="middle">${pad(hh)}</text>`).join('')}</svg>`;
}

  const t=e.target;
  if(t.dataset.evf){ui.evFilter[t.dataset.evf]=t.value;ui.evOpen=null;render();}
  if(t.dataset.nt){S.notify[t.dataset.nt][t.dataset.c]=t.checked;save();}
});
function bindRanges(){
  main.querySelectorAll('[data-range]').forEach(r=>{
    r.addEventListener('input',()=>{const d=S.devices.find(x=>x.id===r.dataset.range);d.bri=+r.value;if(!d.on)d.on=true;
      const sw=r.parentElement.querySelector('.sw');if(sw)sw.setAttribute('aria-checked','true');updateLive();});
    r.addEventListener('change',save);
  });
}
main.addEventListener('submit',e=>{
  e.preventDefault(); const f=e.target;
  if(f.id==='say-form'){const t=$('#say-text').value.trim();if(!t)return;const n=stoneOf(sim.elder.room);
    S.voice.unshift({id:uid(),ts:Date.now(),node:n,text:'（家屬傳話）'+t,intent:'家屬傳話',route:'local',reply:'已播放',ms:320});
    addEvent({sev:'info',type:'家屬傳話',room:sim.elder.room,who:'家屬',text:`由${n}播放：「${t}」`,status:'done',notify:false,handledAt:Date.now()});
    toast(`已由${n}在${sim.elder.room}播放`);render();}
  if(f.dataset.evform){const ev=S.events.find(x=>x.id===f.dataset.evform);ev.status='done';ev.handledAt=Date.now();ev.note=$('#note-'+ev.id).value.trim()||'已確認。';resolveSide(ev);save();ui.evOpen=null;render();toast('事件已標記為已處理');}
  if(f.id==='rem-form'){S.reminders.push({id:uid(),time:$('#rem-time').value,label:$('#rem-label').value.trim(),kind:$('#rem-kind').value,days:$('#rem-days').value,node:'跟隨長者',on:true});ui.addRem=false;save();render();toast('提醒已新增')}
  if(f.id==='rule-form'){S.rules.push({id:uid(),name:$('#ru-name').value.trim(),when:$('#ru-when').value,if:$('#ru-if').value,then:$('#ru-then').value,on:true,count:0,last:null});ui.addRule=false;save();render();toast('規則已新增')}
  if(f.id==='contact-form'){S.contacts.push({id:uid(),name:$('#ct-name').value.trim(),rel:$('#ct-rel').value.trim()||'家屬',phone:$('#ct-phone').value.trim()||'—',ch:['App'],order:Math.max(0,...S.contacts.map(c=>c.order))+1});ui.addContact=false;save();render()}
  if(f.id==='elder-form'){S.elder={name:$('#el-name').value.trim()||'長者',age:+$('#el-age').value||'',note:$('#el-note').value.trim()};save();render();toast('長者資料已儲存')}
});
/* 提示框 */
const tip=$('#tip');
main.addEventListener('mousemove',e=>{const g=e.target.closest('[data-tip]');if(!g){tip.style.display='none';return}
  tip.textContent=g.dataset.tip;tip.style.display='block';const x=Math.min(e.clientX+14,innerWidth-tip.offsetWidth-8);tip.style.left=x+'px';tip.style.top=(e.clientY+14)+'px'});
main.addEventListener('mouseleave',()=>tip.style.display='none');

/* 偶發的環境事件：讓控制台看起來在運作 */
setInterval(()=>{
  const h=new Date().getHours();
  if(Math.random()<.35){
    const opts=[['服藥提醒','翠葉','播報提醒，長者回覆「好」。'],['語音指令','翠葉','長者說「開客廳的燈」，已開啟。'],['空氣品質','翠葉','PM2.5 短暫升高後回落，無需處理。']];
    const o=opts[Math.floor(Math.random()*opts.length)];
    if(h>=7&&h<22){addEvent({sev:'info',type:o[0],room:sim.elder.room,who:o[1],text:o[2],status:'auto',notify:false}); if(cur==='overview'||cur==='events') render(); else renderNav();}
  }
},75000);

render();
setInterval(step,3000);
})();
</script>
</body>
